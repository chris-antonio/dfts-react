<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DFTS — React Component Kit</title>

  <!-- Google Material Symbols (icon font used by the Icon helper — requires internet access) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- DFTS tokens + base + demo chrome -->
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />

  <!-- Component styles (one file per component, matches src/components) -->
  <link rel="stylesheet" href="styles/button.css" />
  <link rel="stylesheet" href="styles/chip.css" />
  <link rel="stylesheet" href="styles/form-controls.css" />
  <link rel="stylesheet" href="styles/input-fields.css" />
  <link rel="stylesheet" href="styles/alert.css" />
  <link rel="stylesheet" href="styles/toast.css" />
  <link rel="stylesheet" href="styles/tooltip.css" />
  <link rel="stylesheet" href="styles/loader.css" />
  <link rel="stylesheet" href="styles/progress-line.css" />
  <link rel="stylesheet" href="styles/link.css" />
  <link rel="stylesheet" href="styles/avatar.css" />
  <link rel="stylesheet" href="styles/divider.css" />
  <link rel="stylesheet" href="styles/tile.css" />
  <link rel="stylesheet" href="styles/card.css" />
  <link rel="stylesheet" href="styles/accordion.css" />
  <link rel="stylesheet" href="styles/modal.css" />
  <link rel="stylesheet" href="styles/tabs.css" />
  <link rel="stylesheet" href="styles/menu.css" />
  <link rel="stylesheet" href="styles/breadcrumbs.css" />
  <link rel="stylesheet" href="styles/navigation-controls.css" />
  <link rel="stylesheet" href="styles/table.css" />
  <link rel="stylesheet" href="styles/date-picker.css" />
  <link rel="stylesheet" href="styles/bottom-sheet.css" />
  <link rel="stylesheet" href="styles/carousel.css" />

  <!-- Demo page layout chrome (not a DFTS component) -->
  <link rel="stylesheet" href="styles/demo.css" />
</head>
<body>
  <div id="root"></div>

  <!-- React 18 UMD, bundled locally so the demo works fully offline aside from the icon font -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>

  <!-- Compiled components (source JSX lives in src/components — see README) -->
  <script src="dist/components/Icon.js"></script>
  <script src="dist/components/Button.js"></script>
  <script src="dist/components/Chip.js"></script>
  <script src="dist/components/FormControls.js"></script>
  <script src="dist/components/InputFields.js"></script>
  <script src="dist/components/Alert.js"></script>
  <script src="dist/components/Toast.js"></script>
  <script src="dist/components/Tooltip.js"></script>
  <script src="dist/components/Loader.js"></script>
  <script src="dist/components/ProgressLine.js"></script>
  <script src="dist/components/Link.js"></script>
  <script src="dist/components/Avatar.js"></script>
  <script src="dist/components/Divider.js"></script>
  <script src="dist/components/Tile.js"></script>
  <script src="dist/components/Card.js"></script>
  <script src="dist/components/Accordion.js"></script>
  <script src="dist/components/Modal.js"></script>
  <script src="dist/components/Tabs.js"></script>
  <script src="dist/components/Menu.js"></script>
  <script src="dist/components/Breadcrumbs.js"></script>
  <script src="dist/components/NavigationControls.js"></script>
  <script src="dist/components/Table.js"></script>
  <script src="dist/components/DatePicker.js"></script>
  <script src="dist/components/BottomSheet.js"></script>
  <script src="dist/components/Carousel.js"></script>

  <!-- Demo app (mounts to #root) -->
  <script src="dist/demo.js"></script>
</body>
</html>
